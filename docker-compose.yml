services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova}
      POSTGRES_DB: nova_sniper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nova -d nova_sniper']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nova]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nova]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    command: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://nova:nova@postgres:5432/nova_sniper}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [nova]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://nova:nova@postgres:5432/nova_sniper}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - '127.0.0.1:${GSP_API_PORT:-4088}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          # Liveness only (process up and serving). Worker/RPC readiness stays
          # visible at /health/ready, but an RPC hiccup must never block the
          # Telegram bot from starting.
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [nova]

  telegram-bot:
    build:
      context: .
      dockerfile: apps/telegram-bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      INTERNAL_API_URL: http://api:4000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgresql://nova:nova@postgres:5432/nova_sniper}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [nova]

  marketing-engine:
    build:
      context: .
      dockerfile: apps/marketing-engine/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://nova:nova@postgres:5432/nova_sniper}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [nova]

  nginx:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - '${GSP_WEB_PORT:-8088}:80'
    volumes:
      - ./docker/nginx/gsp-port.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
    networks: [nova]

  certbot:
    profiles: ['tls']
    image: certbot/certbot:latest
    volumes:
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"
    networks: [nova]

networks:
  nova:

volumes:
  postgres_data:
  redis_data:
