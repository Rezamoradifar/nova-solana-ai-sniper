name: Moneyland neon UI verification

on:
  push:
    branches:
      - codex/moneyland-neon-platform-20261019
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moneyland-neon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Dashboard TypeScript check
        run: npx tsc --noEmit -p apps/dashboard/tsconfig.json
      - name: Amount and model unit tests
        run: npx vitest run apps/dashboard/src/neon/model.test.ts
      - name: Dashboard production build
        run: npm run build --workspace @nova/dashboard
      - name: Install isolated browser QA dependencies
        run: |
          npm install --prefix /tmp/moneyland-browser --no-audit --no-fund playwright@1.56.1 @axe-core/playwright@4.10.2
          node /tmp/moneyland-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser interactions, accessibility and EN/FA screenshots
        run: node scripts/qa-moneyland-neon.cjs
      - name: Package source and built frontend without secrets or fonts
        if: always()
        run: python3 scripts/package-moneyland-neon.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneyland-neon-delivery
          path: moneyland-deliverables/
          retention-days: 14
