name: Admin Backoffice Verify

on:
  push:
    branches:
      - codex/full-admin-backoffice
      - codex/gsp-trading-port-8088
      - codex/gsp-trading-latest-8088
      - codex/copy-trading-ranked-wallets-20261009
      - codex/platform-integration-20261010

jobs:
  docker-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real Docker archived-image recovery
        run: bash scripts/test_copy_rollback_docker.sh
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: TypeScript backend
        run: npx tsc -b packages/shared packages/ai apps/telegram-bot apps/api
      - name: Copy trading network tests
        run: npx vitest run apps/api/src/trading/copyTradeWatcher.test.ts apps/api/src/trading/copyTrading.test.ts apps/api/src/trading/copyWalletRanking.test.ts apps/api/src/routes/copyTrades.test.ts apps/api/src/routes/publicCopyTrading.test.ts apps/api/src/trading/networkTradeScanner.test.ts apps/api/src/trading/shadowModePriceSampler.test.ts apps/api/src/detection/candidatePipeline.test.ts apps/api/src/trading/safety.test.ts
      - name: Copy rollout checks
        run: |
          bash -n scripts/enable-copy-trading.sh scripts/recover-copy-trading.sh
          python3 scripts/test_enable_copy_trading.py
      - name: RPC failover checks
        run: |
          npx vitest run apps/api/src/solana/resilientConnection.test.ts apps/api/src/solana/connection.test.ts
          node --check scripts/check-solana-rpc.mjs
      - name: Platform integration and payment checks
        run: |
          npx vitest run apps/api/src/lib/workerLifecycle.test.ts apps/api/src/lib/integrationHealth.test.ts apps/api/src/business/reviewedPlanPurchase.test.ts apps/api/src/business/planPurchase.test.ts apps/api/src/routes/health.test.ts apps/api/src/routes/integrations.test.ts
          bash -n scripts/deploy-platform.sh scripts/deploy-gsp-trading-latest-8088.sh
          python3 scripts/test_deploy_platform.py
      - name: Dashboard build
        run: npm run build --workspace apps/dashboard
      - name: Compose validation
        run: |
          cp .env.example .env
          docker compose config >/dev/null
